<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080b">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/sico-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/sico-icon.svg">
<title>SICO — Local Playground</title>
<link rel="stylesheet" href="/style.css?v=45">
</head>
<body>
<div id="app"><div class="boot"><div class="boot-logo">SICO<span>.</span></div><div class="boot-line"></div></div></div>
<script>
(function(){
  try {
    if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});});
    if (window.caches) caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k);});});
  } catch(e) {}
})();
</script>
<script src="/app.v35.js?build=45"></script>
<script src="/upgrader.js?v=40"></script>
<script>
setTimeout(function(){
  var a=document.getElementById('app');
  if(a && a.querySelector('.boot')){
    a.innerHTML='<div class="boot-fail"><div><h2>SICO не запустился</h2><p>Проверь консоль браузера (F12) и что сервер запущен из этой папки.</p><button onclick="location.reload()">Перезагрузить</button></div></div>';
  }
},15000);
</script>
</body>
</html>
